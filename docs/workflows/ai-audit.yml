# AI Security Audit with Anthropic API
# Copy to .github/workflows/ai-audit.yml

name: AI Security Audit

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  ai-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install dependencies
        run: composer install --no-dev

      - name: Run AI Security Audit
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          vendor/bin/bear-security-audit src \
            --format=sarif \
            --output=ai-audit.sarif

      - name: Upload to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ai-audit.sarif

      - name: Post token usage
        run: |
          echo "## AI Audit Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f ai-audit-tokens.txt ]; then
            cat ai-audit-tokens.txt >> $GITHUB_STEP_SUMMARY
          else
            echo "Token usage file not found" >> $GITHUB_STEP_SUMMARY
          fi
